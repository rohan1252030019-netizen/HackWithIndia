    <!--
      Fonts: three families total, and only the ones the design actually uses.
      Cabinet Grotesk (display) and JetBrains Mono (technical labels) come from
      Fontshare; Inter (body/UI) from Google. Clash Display and Syne were being
      loaded but referenced nowhere in the stylesheet, so they are gone.

      font-display: swap is declared inside the Fontshare stylesheet; the
      Google URL carries &display=swap. Both are preconnected above.
    -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800,900&f[]=jetbrains-mono@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
